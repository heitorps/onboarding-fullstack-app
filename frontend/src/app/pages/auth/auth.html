<div class="auth-container"></div>
    <div class="auth-card">
        <h2>{{isLoginMode ? 'Entrar no SoundPutos' : 'Criar nova conta'}}</h2>

        <div *ngIf="errorMessage" class="alert error">
            {{errorMessage}}
        </div>

        <div *ngIf="successMessage" class="alert success">
            {{successMessage}}
        </div>

        <form (ngSubmit)="onSubmit()">
            <div class="form-group">
                <label for="username">Usuário</label>
                <input type="text" id="username"
                name="username" [(ngModel)]="username" required>
            </div>

            <div class="form-group">
                <label for="password">Senha</label>
                <input type="password" id="password"
                name="password" [(ngModel)]="password" required>
            </div>

            <button type="submit" class="btn-submit">
                {{isLoginMode ? 'Login' : 'Registrar'}}
            </button>
        </form>

        <p class="toggle-text">
            {{ isLoginMode ? 'Ainda não tem uma conta?' : 'Já possui uma conta?'}}
            <a (click)="toggleMode()">
                {{ isLoginMode ? 'Registe-se aqui' : 'Faça login aqui' }}
            </a>
        </p>
    </div>
